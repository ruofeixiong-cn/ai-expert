services:
  postgres:
    # 官方 postgres 镜像不带 pgvector，必须用这个
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: owner_dev_pw
      POSTGRES_DB: ai_expert
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 只在首次创建数据卷时执行：建扩展 + 建两个运行时角色
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d ai_expert"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
