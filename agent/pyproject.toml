[project]
name = "ai-expert-agent"
version = "0.0.1"
description = "AI 专家平台 · 内容与模型服务（内网服务，不对公网开放）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "trafilatura>=2.2.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "arq>=0.28.0",
    "openai>=3.10.0",
    "pydantic-ai-slim[openai]>=2.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # 黄金问答集用 YAML —— 它要人手写、要带注释解释每道题在测什么。
    # JSON 没有注释，一份没有注释的评测集半年后没人知道当初为什么这么写。
    "pyyaml>=6.0",
]
# 可观测是可选的：默认不装，也默认不开。
#   uv sync --group obs && docker compose --profile obs up -d
# 没装却打开了开关，app/obs.py 会记一条警告然后退回关闭 —— 不会让业务挂掉。
obs = [
    "langfuse>=2.53",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# session 级的 fixture（owner_engine / seeded）和测试必须跑在同一个事件循环里，
# 否则 asyncpg 的连接会 "attached to a different loop"。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
package = false
